    <script>
      try {
        var t = localStorage.getItem('dvds_theme_mode') || 'dark';
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
      if (location.pathname === '/') document.documentElement.setAttribute('data-home-entry', '');
    </script>
    <style>
      html[data-home-entry].dark, html[data-home-entry].dark body { background: #07090E; }
      html[data-home-entry]:not(.dark), html[data-home-entry]:not(.dark) body { background: #FFFFFF; }
    </style>
