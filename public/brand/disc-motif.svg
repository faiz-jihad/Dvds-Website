<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B1B1B" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#242424" stop-opacity="0.6"/>
      <stop offset="42%" stop-color="#1769E0" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#141414" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#E62832" stop-opacity="0.15"/>
      <stop offset="98%" stop-color="#0D0D0D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#333333" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="sheen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#1769E0" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#E62832" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Outer Disc Boundary -->
  <circle cx="400" cy="400" r="390" fill="url(#discGrad)" stroke="#444444" stroke-width="3"/>
  <circle cx="400" cy="400" r="390" fill="url(#sheen1)"/>

  <!-- Concentric High-Density Data Tracks -->
  <circle cx="400" cy="400" r="365" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.1" stroke-dasharray="12 4"/>
  <circle cx="400" cy="400" r="340" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08"/>
  <circle cx="400" cy="400" r="310" stroke="#1769E0" stroke-width="1.2" stroke-opacity="0.2" stroke-dasharray="24 8"/>
  <circle cx="400" cy="400" r="275" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08"/>
  <circle cx="400" cy="400" r="235" stroke="#E62832" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="400" cy="400" r="195" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="6 2"/>

  <!-- Mirror Lead-In Ring -->
  <circle cx="400" cy="400" r="160" stroke="#666666" stroke-width="2" stroke-opacity="0.4" fill="#171717" fill-opacity="0.7"/>
  <circle cx="400" cy="400" r="140" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.15"/>

  <!-- Stacking Ring & Clamping Area -->
  <circle cx="400" cy="400" r="110" stroke="#333333" stroke-width="4" fill="#0D0D0D"/>
  <circle cx="400" cy="400" r="85" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>
  
  <!-- Clear Center Hole -->
  <circle cx="400" cy="400" r="50" fill="#111111" stroke="#1769E0" stroke-width="2.5"/>
  <circle cx="400" cy="400" r="25" fill="#000000" stroke="#444444" stroke-width="1"/>

  <!-- Optical Prism Shimmer Angles -->
  <path d="M 400 400 L 760 210 A 390 390 0 0 1 785 320 Z" fill="#1769E0" fill-opacity="0.06"/>
  <path d="M 400 400 L 40 590 A 390 390 0 0 1 15 480 Z" fill="#E62832" fill-opacity="0.06"/>
</svg>
